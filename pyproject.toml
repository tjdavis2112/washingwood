[project]
name = "washingwood"
version = "0.1.0"
description = "League history app for our ESPN fantasy football league"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Kept so `uv sync --extra pg` from older notes still works; psycopg is now a core dependency
pg = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/washingwood"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "testcontainers[postgres]>=4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
